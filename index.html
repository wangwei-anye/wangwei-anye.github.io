    function getVariance(slope , data , _dataLen){
      let startShoupan = data[0].shoupan;
      let totalVariance = 0;
      for(let i = 0; i < data.length ; i ++){
        let goodShoupan = startShoupan * (slope * (i / (_dataLen - 1))
        let zf = (data[i].shoupan - goodShoupan) / goodShoupan;
        totalVariance +=  zf * zf;
      }
      return totalVariance / _dataLen;
    }

    function getFenshi(data){
      //30 start

      var total = 0;
      var avg = 0;
      var upNum = 0;
      var downNum = 0;
      
      for(let i = 0; i < data.length ; i ++){
        if(i > 0){
          if(data[i].price - avg > 0.77){
              upNum ++;
          }
          if(data[i].price - avg < -0.77){
              downNum ++;
          }
        }
          
        if(i >= 10){
          total += data[i].price;
          total -= data[i - 10].price;
          avg = total / 10;
        }else{
          total += data[i].price;
          avg = total / (i + 1);
        }
      }
      return upNum / downNum;
    }

    function getLikeK(likeArr , myArr){
        var totalUp = 0;
        var totalDown = 0;
        for (let i = 0; i < myArr.length; i++) {
              var up = 0;
              var down = 0;
              for (let j = 0; j < myArr.length; j++) {
                   if (i != j) {
                         if ((myArr[j] - myArr[i]) * (likeArr[j] - likeArr[j] - likeArr[i]) > 0) {
                               up++;
                         } else {
                               down++;
                         }
                   }
              }
              if (up / down > 3.77) {
                 totalUp++
              } else {
                 totalDown++
              }
        }
      return totalUp/totalDown;
    }
